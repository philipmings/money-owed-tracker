<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Money Owed Tracker</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb}
.app{max-width:760px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}
header{padding:24px 2px 14px;display:flex;align-items:center;justify-content:space-between}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6b7280}
.title{margin:4px 0 0;font-size:28px}
.iconbtn{border:0;background:white;border-radius:14px;width:44px;height:44px;box-shadow:0 4px 18px #11182712;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:white;border-radius:20px;padding:18px;box-shadow:0 6px 24px #1118270d}
.label{font-size:12px;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.money{font-size:27px;font-weight:850;margin-top:8px}
.sub{font-size:12px;color:#6b7280;margin-top:5px}
.section{margin-top:20px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sectionhead h2{font-size:17px;margin:0}
.muted{color:#6b7280;font-size:13px}
.search{width:100%;border:1px solid #e5e7eb;background:white;border-radius:14px;padding:13px 14px;font-size:16px;margin-bottom:10px}
.person,.txn{background:white;border-radius:16px;padding:14px 15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 3px 14px #1118270a}
.personname,.txntitle{font-weight:800}
.balances,.txndetail{font-size:12px;color:#6b7280;margin-top:4px}
.amount{text-align:right;font-weight:800}
.positive{color:#047857}.negative{color:#b42318}.zero{color:#6b7280}
.empty{background:white;border:1px dashed #d1d5db;border-radius:18px;padding:24px;text-align:center;color:#6b7280}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));width:min(728px,calc(100% - 32px));border:0;border-radius:18px;background:#111827;color:white;padding:16px 20px;font-size:17px;font-weight:850;box-shadow:0 14px 34px #11182755}
.overlay{position:fixed;inset:0;background:#11182799;display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:white;width:min(760px,100%);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.handle{width:42px;height:5px;border-radius:9px;background:#d1d5db;margin:0 auto 16px}
.sheet h2{margin:0 0 16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:800;color:#4b5563;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;border:1px solid #d1d5db;border-radius:13px;padding:12px 13px;font-size:16px;background:white}
.field textarea{min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid #d1d5db;background:white;border-radius:13px;padding:12px;font-weight:800}
.seg button.on{background:#111827;color:white;border-color:#111827}
.save{width:100%;border:0;border-radius:15px;background:#111827;color:white;padding:15px;font-weight:850;font-size:16px}
.cancel{width:100%;border:0;background:transparent;padding:12px;color:#6b7280;font-weight:700}
.toast{position:fixed;z-index:30;left:50%;top:18px;transform:translateX(-50%);width:min(700px,calc(100% - 30px));background:#111827;color:white;padding:14px 16px;border-radius:15px;box-shadow:0 12px 30px #11182755;display:none}
.lock{position:fixed;inset:0;background:#f5f7fb;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.lockbox{width:min(420px,100%);background:white;padding:26px;border-radius:24px;box-shadow:0 18px 50px #11182718}
.lockbox h1{margin:0 0 8px;font-size:26px}
.lockbox p{color:#6b7280;line-height:1.45}
.lockbox input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:13px;font-size:16px}
.lockbox button{width:100%;margin-top:10px;border:0;border-radius:13px;background:#111827;color:white;padding:13px;font-weight:800;font-size:16px}
.smallbtn{border:0;background:transparent;color:#374151;font-weight:750}
.status{font-size:12px;color:#b42318;margin-top:10px;min-height:18px}
@media(max-width:460px){.money{font-size:22px}.card{padding:15px}.row{grid-template-columns:1fr}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Owed">

</head>
<body>
<div class="lock" id="lock">
  <div class="lockbox">
    <div class="eyebrow">Private ledger</div>
    <h1>Money Owed Tracker</h1>
    <p>Enter your private access key. This device can remember it.</p>
    <input id="keyInput" type="password" placeholder="Access key">
    <button id="unlockBtn">Unlock</button>
    <div class="status" id="lockStatus"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="app">
<header>
  <div><div class="eyebrow">Personal ledger</div><h1 class="title">Money Owed</h1></div>
  <button class="iconbtn" id="refreshBtn">↻</button>
</header>

<div class="grid">
  <div class="card"><div class="label">TTD outstanding</div><div class="money" id="ttdTotal">TT$0.00</div><div class="sub">Kept separate</div></div>
  <div class="card"><div class="label">USD outstanding</div><div class="money" id="usdTotal">US$0.00</div><div class="sub">Kept separate</div></div>
</div>

<section class="section">
  <div class="sectionhead"><h2>People</h2><span class="muted" id="peopleCount">0 people</span></div>
  <input class="search" id="search" placeholder="Search a person">
  <div id="peopleList"></div>
</section>

<section class="section">
  <div class="sectionhead"><h2>Recent activity</h2><button class="smallbtn" id="forgetBtn">Lock app</button></div>
  <div id="recentList"></div>
</section>

<button class="fab" id="addBtn">＋ Add transaction</button>
</div>

<div class="overlay" id="overlay">
<div class="sheet">
<div class="handle"></div>
<h2>Add transaction</h2>
<form id="form">
<div class="field"><label>Person</label><input id="person" required placeholder="Name"></div>
<div class="row">
<div class="field"><label>Currency</label><div class="seg"><button type="button" class="on" data-cur="TTD">TTD</button><button type="button" data-cur="USD">USD</button></div></div>
<div class="field"><label>Amount</label><input id="amount" required type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00"></div>
</div>
<div class="field"><label>Type</label><select id="type">
<option value="cash_loan">Cash loan</option>
<option value="amazon_purchase">Amazon purchase</option>
<option value="purchase_on_behalf">Purchase on behalf</option>
<option value="repayment">Repayment</option>
<option value="adjustment">Adjustment</option>
<option value="other">Other</option>
</select></div>
<div class="field"><label>Effect</label><div class="seg"><button type="button" class="on" data-dir="1">Owes me more</button><button type="button" data-dir="-1">Reduces balance</button></div></div>
<div class="field"><label>Date</label><input id="date" type="date" required></div>
<div class="field"><label>Description (optional)</label><textarea id="description" placeholder="Amazon item, cash borrowed, etc."></textarea></div>
<button class="save" id="saveBtn" type="submit">Save transaction</button>
<button class="cancel" id="cancelBtn" type="button">Cancel</button>
</form>
</div>
</div>

<script>
var API='https://yjdjljrwmdbmrlinkvxc.supabase.co/functions/v1/money-owed-api',
accessKey=localStorage.getItem('moneyOwedAccessKey')||'',
currency='TTD',direction=1,dashboard={balances:[],summary:[],recent:[]};

function el(id){return document.getElementById(id)}
function fmt(n){return new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0))}
function money(n,c){return(c==='USD'?'US$':'TT$')+fmt(n)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function showToast(m){el('toast').textContent=m;el('toast').style.display='block';setTimeout(function(){el('toast').style.display='none'},4200)}
async function api(path,opts){
  opts=opts||{};
  var h=opts.headers||{};
  h.Authorization='Bearer '+accessKey;
  if(opts.body)h['Content-Type']='application/json';
  var r=await fetch(API+(path||''),Object.assign({},opts,{headers:h}));
  var d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.error||'Request failed');
  return d
}
async function unlock(){
  accessKey=el('keyInput').value.trim();
  el('lockStatus').textContent='';
  try{
    await api('?action=ping');
    localStorage.setItem('moneyOwedAccessKey',accessKey);
    el('lock').style.display='none';
    await load()
  }catch(e){el('lockStatus').textContent='That access key did not work.'}
}
async function load(){
  try{dashboard=await api('?action=dashboard');render()}
  catch(e){
    if(e.message==='Unauthorized'){
      localStorage.removeItem('moneyOwedAccessKey');
      el('lock').style.display='flex'
    }else showToast('Could not load ledger: '+e.message)
  }
}
function labelType(t){return({cash_loan:'Cash loan',amazon_purchase:'Amazon',purchase_on_behalf:'Purchase',repayment:'Repayment',adjustment:'Adjustment',other:'Other'})[t]||t}
function statusText(p){
  var a=[],b=[];
  if(p.TTD>0)a.push(money(p.TTD,'TTD'));
  if(p.USD>0)a.push(money(p.USD,'USD'));
  if(p.TTD<0)b.push(money(Math.abs(p.TTD),'TTD'));
  if(p.USD<0)b.push(money(Math.abs(p.USD),'USD'));
  if(a.length)return'Owes '+a.join(' + ');
  if(b.length)return'You owe '+b.join(' + ');
  return'Settled'
}
function render(){
  var totals={TTD:0,USD:0};
  (dashboard.summary||[]).forEach(function(s){totals[s.currency]=Number(s.total_outstanding||0)});
  el('ttdTotal').textContent=money(totals.TTD,'TTD');
  el('usdTotal').textContent=money(totals.USD,'USD');

  var map=new Map();
  (dashboard.balances||[]).forEach(function(b){
    if(!map.has(b.person_id))map.set(b.person_id,{id:b.person_id,name:b.person_name,TTD:0,USD:0});
    map.get(b.person_id)[b.currency]=Number(b.balance||0)
  });
  var people=Array.from(map.values()),
      q=el('search').value.trim().toLowerCase(),
      shown=people.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0});

  el('peopleCount').textContent=people.length+' '+(people.length===1?'person':'people');

  if(!shown.length){
    el('peopleList').innerHTML='<div class="empty">'+(people.length?'No matching person.':'No entries yet. Add your first transaction when ready.')+'</div>'
  }else{
    el('peopleList').innerHTML=shown.map(function(p){
      var cls=(p.TTD>0||p.USD>0)?'positive':((p.TTD<0||p.USD<0)?'negative':'zero');
      return'<div class="person"><div><div class="personname">'+esc(p.name)+'</div><div class="balances">TTD '+money(p.TTD,'TTD')+' · USD '+money(p.USD,'USD')+'</div></div><div class="amount '+cls+'">'+statusText(p)+'</div></div>'
    }).join('')
  }

  var recent=dashboard.recent||[];
  if(!recent.length){
    el('recentList').innerHTML='<div class="empty">No transactions yet.</div>'
  }else{
    el('recentList').innerHTML=recent.map(function(t){
      var name=t.people&&t.people.name?t.people.name:'Unknown',
          signed=Number(t.signed_amount||0);
      return'<div class="txn"><div><div class="txntitle">'+esc(name)+' · '+labelType(t.transaction_type)+'</div><div class="txndetail">'+t.transaction_date+(t.description?' · '+esc(t.description):'')+'</div></div><div class="amount '+(signed>=0?'positive':'negative')+'">'+(signed>=0?'+':'−')+money(Math.abs(signed),t.currency)+'</div></div>'
    }).join('')
  }
}
function setCur(c){currency=c;document.querySelectorAll('[data-cur]').forEach(function(b){b.classList.toggle('on',b.dataset.cur===c)})}
function setDir(d){direction=Number(d);document.querySelectorAll('[data-dir]').forEach(function(b){b.classList.toggle('on',Number(b.dataset.dir)===direction)})}
function openSheet(){
  el('form').reset();
  setCur('TTD');
  setDir(1);
  el('date').value=new Date().toISOString().slice(0,10);
  el('overlay').style.display='flex';
  setTimeout(function(){el('person').focus()},100)
}
function closeSheet(){el('overlay').style.display='none'}

el('unlockBtn').onclick=unlock;
el('keyInput').onkeydown=function(e){if(e.key==='Enter')unlock()};
el('refreshBtn').onclick=load;
el('search').oninput=render;
el('addBtn').onclick=openSheet;
el('cancelBtn').onclick=closeSheet;
el('forgetBtn').onclick=function(){
  localStorage.removeItem('moneyOwedAccessKey');
  accessKey='';
  el('keyInput').value='';
  el('lock').style.display='flex'
};
document.querySelectorAll('[data-cur]').forEach(function(b){b.onclick=function(){setCur(b.dataset.cur)}});
document.querySelectorAll('[data-dir]').forEach(function(b){b.onclick=function(){setDir(b.dataset.dir)}});
el('type').onchange=function(){
  if(el('type').value==='repayment')setDir(-1);
  else if(el('type').value!=='adjustment')setDir(1)
};
el('form').onsubmit=async function(e){
  e.preventDefault();
  var btn=el('saveBtn');
  btn.disabled=true;
  btn.textContent='Saving…';
  try{
    var d=await api('?action=transaction',{
      method:'POST',
      body:JSON.stringify({
        person_name:el('person').value,
        currency:currency,
        transaction_type:el('type').value,
        description:el('description').value,
        amount:Number(el('amount').value),
        direction:direction,
        transaction_date:el('date').value
      })
    }),
    r=d.result;
    closeSheet();
    showToast('Saved. '+r.person_name+': '+money(r.previous_balance,r.currency)+' → '+money(r.new_balance,r.currency));
    await load()
  }catch(err){
    showToast('Not saved: '+err.message)
  }finally{
    btn.disabled=false;
    btn.textContent='Save transaction'
  }
};

if(accessKey){
  el('keyInput').value=accessKey;
  unlock()
}else{
  el('lock').style.display='flex'
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>

</body>
</html>
